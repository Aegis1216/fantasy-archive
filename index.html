
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>판타지 아카이브 | duehy</title>
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Arial, "Malgun Gothic", sans-serif;
  background: #080c16;
  color: #eaf2ff;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  padding: 22px 7%;
  background: #0e1830;
  border-bottom: 1px solid #24518b;
}

.logo {
  color: #65b6ff;
  font-size: 20px;
  font-weight: bold;
}

nav a {
  color: #d7e9ff;
  text-decoration: none;
  margin-left: 18px;
}

.hero {
  padding: 110px 7%;
  text-align: center;
  background: radial-gradient(
    ellipse at top,
    #194c96 0%,
    #101e3d 48%,
    #080c16 90%
  );
}

.hero h1 {
  font-size: clamp(36px, 6vw, 65px);
  margin: 20px 0;
}

.hero h1 span {
  color: #65b6ff;
  text-shadow: 0 0 25px #338cff;
}

.hero p {
  color: #bed7fa;
  line-height: 1.9;
}

.button {
  display: inline-block;
  margin-top: 24px;
  padding: 15px 30px;
  border-radius: 8px;
  background: #338cff;
  color: white;
  text-decoration: none;
  box-shadow: 0 0 25px #338cff66;
}

.works {
  max-width: 1200px;
  margin: auto;
  padding: 65px 7%;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 22px;
  margin-top: 30px;
}

.card {
  overflow: hidden;
  background: #111e38;
  border: 1px solid #28538a;
  border-radius: 12px;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-5px);
  border-color: #65b6ff;
  box-shadow: 0 0 22px #338cff44;
}

.cover {
  height: 230px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #2156a5, #10182a);
  color: #d4eaff;
  font-weight: bold;
}

.info { padding: 22px; }
.info p { color: #b4c9e8; line-height: 1.7; }

footer {
  padding: 30px;
  text-align: center;
  color: #91a9ca;
  border-top: 1px solid #24416b;
}
</style>
</head>
<body>

<header>
  <div class="logo">✦ FANTASY ARCHIVE</div>
  <nav>
    <a href="#home">홈</a>
    <a href="#works">작품 목록</a>
  </nav>
</header>

<main>
  <section class="hero" id="home">
    <p>듀희 FANTASY WORLD</p>
    <h1>판타지 <span>아카이브</span></h1>
    <p>수많은 세계와 그 안에 살아가는 존재들.<br>
    듀희가 만들어가는 판타지의 기록.</p>
    <a href="#works" class="button">세계관 탐색하기</a>
  </section>

  <section class="works" id="works">
    <h2>작품 아카이브</h2>
    <p>다양한 세계관과 캐릭터들의 이야기를 만나보세요.</p>

    <div class="cards">
      <article class="card">
 
<div class="cover">
  <img src="world1-cover.jpg.png" alt="첫 번째 작품 표지"
       style="width:100%; height:100%; object-fit:cover;">
</div>

        <div class="info">
          <h3>전쟁이 끝난 세상</h3>
          <p>전쟁이 끝난 세상에 당신의 이야기</p>
        </div>
      </article>

      <article class="card">
        <div class="cover"><img src="world2-cover.png" alt="두 번째 작품 표지" style="width:100%; height:100%; object-fit:cover;"></div>
        <div class="info">
          <h3>내 애완동물은 XX파트너</h3>
          <p>귀여운 동물을 분양 받다</p>
        </div>
      </article>

      <article class="card">
       
<div class="cover"><img src="world3-cover.%20png.png" alt="세 번째 작품 표지" style="width:100%; height:100%; object-fit:cover;"></div>

        <div class="info">
          <h3>오!나의 성좌님</h3>
          <p>흔한 성좌물.4명의 화신이 기다린다</p>
        </div>
      </article>
    </div>
  </section>
</main>

<footer>
  © 2026 duehy · Fantasy Archive
</footer>

</body>
</html>
